name: OWNEX Tauri Multi-Platform Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── Build backend sidecar for each platform ──
  build-backend-sidecar:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: ownex-backend-windows
            pyinstaller_cmd: .venv\Scripts\pyinstaller.exe
            python_cmd: .venv\Scripts\python.exe
            sidecar_name: ownex-backend.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: ownex-backend-linux
            pyinstaller_cmd: .venv/bin/pyinstaller
            python_cmd: .venv/bin/python
            sidecar_name: ownex-backend
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: ownex-backend-macos
            pyinstaller_cmd: .venv/bin/pyinstaller
            python_cmd: .venv/bin/python
            sidecar_name: ownex-backend
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python ──
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install Python dependencies
        run: |
          ${{ matrix.python_cmd }} -m pip install --upgrade pip
          ${{ matrix.python_cmd }} -m pip install -r requirements.txt
          ${{ matrix.python_cmd }} -m pip install pyinstaller

      # ── Build backend sidecar ──
      - name: Build backend sidecar (PyInstaller)
        run: |
          ${{ matrix.pyinstaller_cmd }} OWNEX-Backend.spec --clean --noconfirm

      # Rename Windows binary to remove .exe extension (Tauri expects base name)
      - name: Normalize sidecar name (Windows)
        if: runner.os == 'Windows'
        run: |
          if (Test-Path "dist\ownex-backend.exe") {
            Move-Item "dist\ownex-backend.exe" "dist\ownex-backend" -Force
            Write-Host "Renamed ownex-backend.exe to ownex-backend"
          }
        shell: pwsh

      - name: Validate sidecar exists
        run: |
          $exe = "dist/${{ matrix.sidecar_name }}"
          # On Windows, the spec now outputs ownex-backend (without .exe)
          $actual_name = "${{ matrix.sidecar_name }}"
          if ($actual_name -eq "ownex-backend.exe") { $actual_name = "ownex-backend" }
          $exe = "dist/$actual_name"
          if (!(Test-Path $exe)) { throw "Sidecar not found: $exe" }
          $size = (Get-Item $exe).Length
          Write-Host "Sidecar size: $([math]::Round($size / 1MB, 2)) MB"
          if ($size -lt 50MB) { throw "Sidecar suspiciously small ($([math]::Round($size / 1MB, 2)) MB)" }
        shell: pwsh

      # Smoke test sidecar (Windows only - other platforms run Tauri build which tests it)
      - name: Smoke test sidecar runtime
        if: runner.os == 'Windows'
        run: |
          $exe = "dist\ownex-backend.exe"
          if (!(Test-Path $exe)) { $exe = "dist\ownex-backend" }
          $err = "$env:RUNNER_TEMP\sidecar_err.txt"
          $p = Start-Process $exe -ArgumentList "--port","8199" -PassThru -RedirectStandardError $err
          $ok = $false
          for ($i = 0; $i -lt 45; $i++) {
            Start-Sleep -Seconds 2
            if ($p.HasExited) { break }
            try { Invoke-RestMethod "http://127.0.0.1:8199/api/health" -TimeoutSec 3 | Out-Null; $ok = $true; break } catch {}
          }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          if (-not $ok) {
            Write-Host "=== sidecar stderr ==="
            Get-Content $err -Tail 20 -ErrorAction SilentlyContinue | ForEach-Object { $_ }
            throw "Sidecar failed /api/health"
          }
          Write-Host "Sidecar smoke: PASS"
        shell: pwsh

      # ── Upload sidecar artifact (without dist/ prefix) ──
      - name: Upload sidecar artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/ownex-backend
          if-no-files-found: error

  # ── Tauri build for each platform ──
  build-tauri:
    needs: build-backend-sidecar
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            artifact_name: OWNEX-Tauri-Windows
            artifact_paths: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/**/*.sha256
          - os: ubuntu-latest
            artifact_name: OWNEX-Tauri-Linux
            artifact_paths: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/**/*.sha256
          - os: macos-latest
            artifact_name: OWNEX-Tauri-macOS
            artifact_paths: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app
              src-tauri/target/release/bundle/**/*.sha256
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Download sidecar artifact to current directory
      - name: Download sidecar
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.os == 'windows-latest' && 'ownex-backend-windows' || matrix.os == 'ubuntu-latest' && 'ownex-backend-linux' || 'ownex-backend-macos' }}
          path: sidecar

      # Verify sidecar download and move to dist/
      - name: Verify and move sidecar
        shell: bash
        run: |
          echo "=== Sidecar Download Verification ==="
          ls -la sidecar/
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            if [ -f sidecar/ownex-backend.exe ]; then
              mkdir -p dist
              mv sidecar/ownex-backend.exe dist/
              echo "Windows sidecar: MOVED TO dist/"
            elif [ -f sidecar/ownex-backend ]; then
              mkdir -p dist
              mv sidecar/ownex-backend dist/
              echo "Windows sidecar (no .exe): MOVED TO dist/"
            else
              echo "ERROR: Windows sidecar not found in sidecar/"
              ls -la sidecar/
              exit 1
            fi
          else
            if [ -f sidecar/ownex-backend ]; then
              mkdir -p dist
              mv sidecar/ownex-backend dist/
              echo "Linux/macOS sidecar: MOVED TO dist/"
            else
              echo "ERROR: Linux/macOS sidecar not found"
              ls -la sidecar/
              exit 1
            fi
          fi
          ls -la dist/

      # Copy sidecar to Tauri binaries
      - name: Prepare Tauri sidecar (Windows)
        if: runner.os == 'Windows'
        run: |
          $destDir = "src-tauri\binaries"
          $src = "dist\ownex-backend"
          $dest = "$destDir\ownex-backend"
          if (!(Test-Path $src)) { throw "Source sidecar not found: $src" }
          if (!(Test-Path $destDir)) { New-Item -ItemType Directory -Path $destDir -Force }
          Copy-Item $src $dest -Force
          Write-Host "Sidecar copied to: $dest"
          if (Test-Path $dest) { Write-Host "VERIFIED: Sidecar exists at destination" } else { throw "Sidecar copy failed" }
        shell: pwsh

      - name: Prepare Tauri sidecar (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          destDir="src-tauri/binaries"
          src="dist/ownex-backend"
          dest="$destDir/ownex-backend"
          mkdir -p "$destDir"
          if [ ! -f "$src" ]; then echo "ERROR: Source sidecar not found: $src"; exit 1; fi
          cp "$src" "$dest"
          chmod +x "$dest"
          echo "Sidecar ready: $dest"
          if [ -f "$dest" ]; then echo "VERIFIED: Sidecar exists at destination"; else echo "ERROR: Sidecar copy failed"; exit 1; fi
          ls -la "$destDir"

      # ── Node.js ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies (root + frontend)
        run: |
          npm ci
          cd frontend && npm ci
          cd ..

      # Verify Tauri CLI installation
      - name: Verify Tauri CLI
        run: |
          set +e
          echo "=== Tauri CLI Verification ==="
          echo "Node: $(node --version)"
          echo "NPM: $(npm --version)"
          echo "NPX: $(npx --version)"
          echo "Checking root node_modules..."
          ls -la node_modules/.bin/tauri* 2>/dev/null || echo "Root tauri NOT FOUND"
          echo "Frontend tauri: $(ls -la frontend/node_modules/.bin/tauri* 2>/dev/null || echo 'NOT FOUND')"
          echo "Root package.json tauri: $(grep -A2 '@tauri-apps/cli' package.json || echo 'NOT IN PACKAGE.JSON')"
          echo "Trying npx tauri --version..."
          npx tauri --version 2>&1 || echo "npx tauri FAILED"
          echo "Trying tauri directly..."
          tauri --version 2>&1 || echo "tauri direct FAILED"
        continue-on-error: true

      # Rust
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustc, cargo, rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      # Build frontend
      - name: Build frontend (Vue + Vite)
        run: |
          cd frontend
          npm run build
          cd ..

      # Debug: Check environment before build
      - name: Debug environment
        shell: bash
        run: |
          set +e
          echo "=== Environment Debug ==="
          echo "PWD: $(pwd)"
          echo "OS: $RUNNER_OS"
          echo "Node: $(node --version)"
          echo "NPM: $(npm --version)"
          echo "Rust: $(rustc --version)"
          echo "Cargo: $(cargo --version)"
          echo "Tauri CLI: $(npx tauri --version 2>&1 || echo 'FAILED')"
          echo "Frontend dist exists: $(test -d frontend/dist && echo YES || echo NO)"
          echo "Frontend dist files: $(ls -la frontend/dist 2>/dev/null | wc -l)"
          echo "src-tauri exists: $(test -d src-tauri && echo YES || echo NO)"
          echo "Cargo.toml exists: $(test -f src-tauri/Cargo.toml && echo YES || echo NO)"
          echo "tauri.conf.json exists: $(test -f src-tauri/tauri.conf.json && echo YES || echo NO)"
          echo "Sidecar exists: $(test -f src-tauri/binaries/ownex-backend && echo YES || echo NO)"
          echo "Sidecar (exe) exists: $(test -f src-tauri/binaries/ownex-backend.exe && echo YES || echo NO)"
          echo "=== tauri.conf.json ==="
          cat src-tauri/tauri.conf.json
          set -e
        env:
          RUST_BACKTRACE: 1

      # Linux deps
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      # macOS deps
      - name: macOS setup
        if: runner.os == 'macOS'
        run: |
          echo "macOS build - checking Xcode and dependencies"
          xcode-select -p || xcode-select --install
          rustup --version || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env
          sw_vers

      # Cargo check before Tauri build
      - name: Cargo check
        run: |
          cd src-tauri
          cargo check --verbose 2>&1 | tee cargo-check.log
        env:
          RUST_BACKTRACE: 1

      # Upload cargo check log on failure
      - name: Upload cargo check log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-check-log-${{ runner.os }}
          path: src-tauri/cargo-check.log
          if-no-files-found: warn

      # Linux deps
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      # macOS deps
      - name: macOS setup
        if: runner.os == 'macOS'
        run: |
          echo "macOS build - checking Xcode and dependencies"
          xcode-select -p || xcode-select --install
          rustup --version || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env
          sw_vers

      # Tauri build with verbose output
      - name: Tauri build
        run: |
          echo "=== Tauri CLI version ==="
          npx tauri --version
          echo "=== Rust version ==="
          rustc --version
          cargo --version
          echo "=== Starting Tauri build ==="
          npx tauri build --verbose 2>&1 | tee tauri-build.log
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          RUST_BACKTRACE: 1
          CARGO_TERM_COLOR: always

      # Upload build log on failure
      - name: Upload Tauri build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-log-${{ runner.os }}
          path: tauri-build.log
          if-no-files-found: warn

      # Verify output (non-failing)
      - name: Verify Tauri output
        shell: bash
        run: |
          set +e
          echo "=== Tauri build output ==="
          find src-tauri/target/release/bundle -type f \( -name "*.msi" -o -name "*.exe" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.dmg" -o -name "*.app" \) -exec ls -lh {} \;
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "WARNING: No output files found in expected locations"
            echo "Checking all files in target/release/bundle:"
            find src-tauri/target/release/bundle -type f -exec ls -lh {} \; 2>/dev/null || echo "No files found"
          fi
          set -e

      # Calculate checksums
      - name: Calculate SHA256 checksums
        run: |
          find src-tauri/target/release/bundle -type f \( -name "*.msi" -o -name "*.exe" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.dmg" \) -exec sh -c 'sha256sum "$1" > "$1.sha256"' _ {} \;

      # Upload artifacts
      - name: Upload Tauri artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_paths }}
          if-no-files-found: warn

      # Upload checksums
      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-checksums
          path: src-tauri/target/release/bundle/**/*.sha256
          if-no-files-found: warn

